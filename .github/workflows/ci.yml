name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fyne's glfw driver needs Wayland/X11 development headers on Linux.
      - name: Install GL/Wayland headers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # xorg-dev alone does not pull in the Wayland client headers on
          # Ubuntu 24.04; Fyne's glfw driver needs them explicitly.
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o bin/chilltransfer ./cmd/chilltransfer
